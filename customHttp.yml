# Browser cache for static files. Amplify's default is
# `Cache-Control: public, max-age=0, s-maxage=31536000`: CloudFront keeps a
# copy, but every browser visit re-downloads the file, and Amplify bills
# data transfer out on those bytes ($0.15/GB) even on a CDN hit.
#
# Hashed Vite bundles can stay cached for a year. Video and images use a
# week so a replaced file shows up without a rename, while repeat visits
# over a festival weekend come from the browser cache.
customHeaders:
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.mp4'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.webm'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.jpg'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.jpeg'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.png'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.webp'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.gif'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.svg'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.ico'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '**/*.woff2'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
